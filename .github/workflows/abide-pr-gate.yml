name: abide PR gate

# Read-only gate: runs the M010/S03 issue-PR contract check (outcome parity +
# abide/JEV section) on every PR targeting main. It never posts comments,
# labels, or merges — a refusal exits non-zero and fails the check.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: abide-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  abide-contract:
    name: abide/JEV contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Smoke check: the Q15 handoff CLI loads and prints its usage text.
      # `--help` is not a supported flag, so the process exits 2 with usage on
      # stderr — absorb that exit and assert the usage text is present.
      - name: Smoke check jeve-report CLI
        run: |
          out="$(node scripts/hooks/jeve-report.mjs --help 2>&1 || true)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'usage:'

      # The contract gate needs both a PR and its linked issue body
      # (`--pr <n> --issue <m>`); `--pr` alone is a usage error (exit 2).
      # Slice PRs cite the issue as `Closes #<n>` in the body.
      - name: Resolve linked slice issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body="$(gh pr view "$PR_NUMBER" --json body --jq .body)"
          issue="$(printf '%s\n' "$body" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) *#[0-9]+' \
            | grep -oE '[0-9]+' \
            | head -n1 || true)"
          if [ -z "$issue" ]; then
            echo "::error::No linked slice issue found in the PR body (expected 'Closes #<n>'). The abide/JEV contract gate requires one."
            exit 1
          fi
          echo "linked=$issue" >> "$GITHUB_OUTPUT"
          echo "Linked slice issue: #$issue"

      # Exit 0 gate clear; exit 1 refusal (parity mismatch, missing trailer,
      # missing/act/band JEV section, etc.); exit 2 usage — all non-zero fail.
      - name: Run abide/JEV contract gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/gsd-pr-contract.mjs \
            --pr "$PR_NUMBER" \
            --issue "${{ steps.issue.outputs.linked }}" \
            --dry-run
