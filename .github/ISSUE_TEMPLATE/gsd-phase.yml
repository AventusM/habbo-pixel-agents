name: "GSD Phase / Slice"
description: "Implement a feature slice following GSD workflow conventions"
labels: ["gsd-phase"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to define a GSD slice for Copilot to implement. Assign the issue to Copilot with the `gsd-phase` agent.

        The slice plan lives in the GSD Pi state store (`.gsd/`) — the Copilot
        agent implements the code and reports against the Outcomes contract;
        it does not write `.gsd/` state files directly.

  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: "Milestone ID — must exist in the GSD Pi state store (e.g., M003)"
      placeholder: "M003"
    validations:
      required: true

  - type: input
    id: slice-number
    attributes:
      label: Slice Number
      description: "Slice ID as registered in the GSD milestone (e.g., S03)"
      placeholder: "S06"
    validations:
      required: true

  - type: input
    id: slice-name
    attributes:
      label: Slice Name
      description: "Short descriptive name"
      placeholder: "Widget Animation System"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: "One-sentence deliverable"
      placeholder: "Add CSS-based animation transitions to widget state changes"
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk Level
      options:
        - low
        - medium
        - high
    validations:
      required: true

  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      description: "Comma-separated slice IDs this depends on (leave empty if none)"
      placeholder: "S04, S05"

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: "Numbered list of implementation tasks"
      placeholder: |
        1. Create animation utility module with easing functions
        2. Wire animation hooks into widget state machine
        3. Add unit tests for animation timing
    validations:
      required: true

  - type: textarea
    id: outcomes
    attributes:
      label: Outcomes (O-N contracts)
      description: "Verifiable end states, one per line, phrased as `O-N — outcome`. The assigned agent ticks these when verified; the gsd-loop outcomes tool syncs them."
      placeholder: |
        O-1 — Widget state transitions animate over 200ms
        O-2 — No animation on initial render
        O-3 — Tests cover all easing functions
    validations:
      required: true

  - type: textarea
    id: exclusions
    attributes:
      label: Exclusions (X-N fences)
      description: "Explicit non-goals, one per line (X-N — exclusion). Anything inside these fences is out of scope for the assignment."
      placeholder: |
        X-1 — no changes to the room render pipeline
        X-2 — no new dependencies
